[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalmap"
version = "0.4.0"
description = "Open, sensor-agnostic platform: stream raw signals from any (even salvaged) sensor, embed them unsupervised, explore the latent landscape for unknown patterns."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SignalMap contributors" }]
keywords = ["tinyml", "iot", "unsupervised", "anomaly-detection", "edge-ai", "sensors", "signal-processing"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware",
]
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
sensors = ["sounddevice>=0.4", "pyarrow>=15.0", "paho-mqtt>=2.0"]
ingest = ["aiomqtt>=2.0", "pyarrow>=15.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
store = ["qdrant-client>=1.9"]
viz = ["umap-learn>=0.5", "hdbscan>=0.8"]
distill = ["scipy>=1.11", "scikit-learn>=1.4"]
attest = ["cryptography>=42"]
dev = ["pytest>=8.0", "scipy>=1.11", "scikit-learn>=1.4"]
all = ["sounddevice>=0.4", "pyarrow>=15.0", "paho-mqtt>=2.0", "aiomqtt>=2.0",
       "fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.9", "pytest>=8.0",
       "scipy>=1.11", "scikit-learn>=1.4"]

[project.urls]
Homepage = "https://github.com/MrPredic/signalmap"
Documentation = "https://github.com/MrPredic/signalmap/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
signalmap = "signalmap.cli:main"

[tool.setuptools]
packages = ["signalmap", "sensors"]

[tool.pytest.ini_options]
testpaths = ["signalmap/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly, not inherited: ruff's defaults change between releases,
# and an unpinned rule set turns any upstream release into a red build.
select = ["E4", "E7", "E9", "F", "W"]
# E701/E702/E731 flag the compact one-liners this codebase uses on purpose
# (tight numeric helpers); everything else stays on so real defects surface.
ignore = ["E701", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
# Tests keep imports next to the section they belong to, for readability.
"signalmap/tests/*" = ["E402"]
