name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install ruff==0.16.0   # pinned: ruff changes defaults between releases
      - run: ruff check signalmap/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable package + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyarrow   # [dev] = pytest + scipy + scikit-learn (distill/premium suite)
      - name: Test
        run: pytest -q -n auto        # 8 workers: 5:05 -> 1:47 wall clock
      - name: Smoke (installed entry point)
        run: |
          signalmap plugins
          signalmap run --source sim --sink stdout --limit 5

  # A fresh venv WITHOUT signalmap installed
  # verifies a real receipt -> PASS, a tampered one -> FAIL.
  verify-receipt-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Produce a real signed receipt with the full package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          from signalmap.distill import FeatureSpec, W
          from signalmap.cli import build_parser, cmd_fit
          spec = FeatureSpec(programs=["acf1(id(id(x)))", "specratio(id(id(x)))"],
                             classes=["healthy", "faulty"])
          spec.save("spec.json")
          bank = Path("healthy"); bank.mkdir()
          rng = np.random.default_rng(0)
          t = np.arange(4 * W)
          for r in range(2):
              s = np.sin(2 * np.pi * 0.01 * t) + 0.1 * rng.standard_normal(t.size)
              np.save(bank / f"healthy_{r}.npy", s.astype(np.float64))
          cmd_fit(build_parser().parse_args(
              ["fit", "--spec", "spec.json", "--bank", "healthy", "--out", "det.json"]))
          PY
      - name: Verify from a bare venv (no signalmap install)
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install cryptography
          /tmp/bare/bin/python -c "import signalmap" && exit 1 || true
          /tmp/bare/bin/python tools/verify_receipt.py det.json.receipt.json
      - name: Tampered receipt must FAIL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("det.json.receipt.json")
          raw = bytearray(p.read_bytes())
          raw[raw.find(b'"claim"') + 12] ^= 0x01
          p.write_bytes(bytes(raw))
          PY
          if /tmp/bare/bin/python tools/verify_receipt.py det.json.receipt.json; then
            echo "tampered receipt verified — red-team gate broken"; exit 1
          fi
